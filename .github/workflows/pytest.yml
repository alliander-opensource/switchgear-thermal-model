name: |
  (T) Pytest
permissions:
  contents: read
  pull-requests: write

on:
  push:
  workflow_dispatch:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'
        description: 'Python version used.'

jobs:
  pytest:
    runs-on:
      group: managed-linux
    env:
      PYTHON_VERSION: ${{ github.event.inputs['python-version'] || '3.12' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install python${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pipx install --python python${{ env.PYTHON_VERSION }} uv==0.11.31
      - name: Install the library using uv
        shell: bash
        run: uv sync --group dev --no-install-project --no-build --frozen
      - name: Unit tests
        if: ${{ hashFiles('tests/') != '' }}
        shell: bash
        run: PYTHONPATH=. uv run --no-sync --no-build pytest
      - name: Upload coverage.xml as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: ${{ hashFiles('coverage.xml') != '' }}
        with:
          name: coverage.xml
          path: ./coverage.xml
